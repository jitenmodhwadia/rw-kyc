<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Richwealth Re-KYC &amp; Consent</title>
<meta name="description" content="Richwealth re-KYC and consent — PAN, Aadhaar, photo and consent.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6ec; --cream2:#f3ecd9; --paper:#fffdf7;
    --gold:#b08d2e; --gold-dk:#8a6d1f; --line:#e2d5ae;
    --navy:#14213d; --ink:#1f2433; --muted:#6b6553;
    --green:#6f9e2b; --green-bg:#f2f7e8; --err:#b3261e; --err-bg:#fdf1f0;
    --head:"Playfair Display",Georgia,serif; --body:Inter,system-ui,sans-serif;
  }
  html[lang=gu]{--head:"Noto Serif Gujarati","Playfair Display",serif; --body:"Noto Serif Gujarati",Inter,sans-serif}
  html[lang=hi]{--head:"Noto Serif Devanagari","Playfair Display",serif; --body:"Noto Serif Devanagari",Inter,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:linear-gradient(180deg,var(--cream) 0%,var(--cream2) 100%) fixed; color:var(--ink); font:17px/1.6 var(--body); -webkit-font-smoothing:antialiased}
  .wrap{max-width:680px; margin:0 auto; padding:0 16px}
  h1,h2,h3{font-family:var(--head); line-height:1.3; margin:0}

  .gate{position:fixed; inset:0; z-index:50; background:rgba(20,33,61,.94); display:flex; align-items:center; justify-content:center; padding:16px}
  .gate[hidden]{display:none}
  .gatebox{background:var(--paper); border:2px solid var(--gold); border-radius:16px; padding:26px 22px; width:100%; max-width:360px; text-align:center}
  .gatebox img{width:180px; height:auto}
  .gatebox p{margin:10px 0 16px; color:var(--gold-dk); font:600 15px/1.6 "Noto Serif Gujarati","Noto Serif Devanagari",Inter,sans-serif}
  .gatebox button{display:block; width:100%; margin-top:10px; padding:14px; border-radius:10px; border:1.5px solid var(--gold); background:#fff; color:var(--navy); cursor:pointer;
    font:700 18px/1.2 "Noto Serif Gujarati","Noto Serif Devanagari",Inter,sans-serif}
  .gatebox button:hover,.gatebox button:focus{background:var(--gold); color:#fff; outline:none}

  header{padding:18px 0 4px; text-align:center}
  .langbar{display:flex; justify-content:flex-end; gap:6px; margin-bottom:6px}
  .langbar button{background:transparent; border:1px solid var(--line); color:var(--gold-dk); border-radius:999px; padding:5px 12px; cursor:pointer;
    font:600 13px/1.2 "Noto Serif Gujarati","Noto Serif Devanagari",Inter,sans-serif}
  .langbar button[aria-pressed=true]{background:var(--gold); border-color:var(--gold); color:#fff}
  .logo{width:200px; max-width:60%; height:auto}
  header h1{font-size:clamp(25px,6vw,34px); color:var(--navy); margin:10px 0 6px}
  header .sub{color:var(--muted); margin:0 auto; max-width:560px}
  .steps3{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0 0; padding:0; list-style:none}
  .steps3 li{background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:14px; color:var(--gold-dk)}
  .steps3 b{color:var(--navy)}

  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 18px; margin-top:16px; box-shadow:0 2px 10px rgba(138,109,31,.06)}
  .card h2{font-size:clamp(20px,4.6vw,24px); color:var(--navy); display:flex; gap:10px; align-items:center; margin-bottom:4px}
  .num{flex:none; width:30px; height:30px; border-radius:50%; background:var(--gold); color:#fff; font:700 15px/30px Inter,sans-serif; text-align:center}
  .intro{color:var(--muted); font-size:15px; margin:0 0 16px}

  .field{margin-bottom:16px; border:0; padding:0; min-width:0}
  .field > label, .field > .lbl, .field legend{display:block; font-weight:600; font-size:16px; margin-bottom:6px; padding:0}
  .req{color:var(--err)}
  .hint{display:block; font-weight:400; color:var(--muted); font-size:13.5px; margin:2px 0 6px}
  input[type=text],input[type=tel],input[type=email],textarea{width:100%; font:17px var(--body); color:var(--ink); background:var(--paper); border:1.5px solid #d9c98f; border-radius:9px; padding:12px 13px}
  textarea{min-height:90px; resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(176,141,46,.2); background:#fff}
  .phone{display:flex; gap:8px}
  .phone select{flex:none; max-width:130px; font:16px var(--body); background:var(--paper); border:1.5px solid #d9c98f; border-radius:9px; padding:12px 8px}
  .row2{display:grid; gap:0 14px; grid-template-columns:1fr}
  @media(min-width:520px){ .row2{grid-template-columns:1fr 1fr} }
  .chips{display:flex; flex-direction:column; gap:8px}
  .chip{display:flex; align-items:center; gap:10px; border:1.5px solid #d9c98f; background:var(--paper); border-radius:10px; padding:12px 14px; cursor:pointer}
  .chip input{width:20px; height:20px; margin:0; accent-color:var(--gold-dk); flex:none}
  .chip:has(input:checked){background:#fbf1d3; border-color:var(--gold)}
  .err{display:none; color:var(--err); font-size:14px; margin-top:5px}
  .field.bad .err{display:block}
  .field.bad input,.field.bad textarea,.field.bad .chip,.field.bad .drop,.field.bad .agree{border-color:var(--err)}
  .hide{display:none !important}

  .drop{display:flex !important; align-items:center; gap:12px; border:1.5px dashed #cdb873; background:var(--paper); border-radius:10px; padding:12px; cursor:pointer; margin:0 !important; font-weight:400 !important}
  .drop:hover{background:#fdf7e6}
  .drop .ic{flex:none; width:44px; height:44px; border-radius:9px; background:#f3e8c6; display:flex; align-items:center; justify-content:center; color:var(--gold-dk)}
  .drop .tx{font-size:14px; color:var(--muted)}
  .drop .tx b{display:block; color:var(--ink); font-size:15.5px}
  .drop input{position:absolute; width:1px; height:1px; opacity:0}
  .drop.has{border-style:solid; border-color:var(--green); background:var(--green-bg)}
  .drop.has .ic{background:var(--green); color:#fff}
  .prev{display:flex; align-items:center; gap:10px; margin-top:8px}
  .prev img{width:92px; height:62px; object-fit:cover; border-radius:6px; border:1px solid var(--line)}
  .prev .pdf{width:92px; height:62px; display:flex; align-items:center; justify-content:center; font:700 15px Inter,sans-serif; color:var(--err); background:var(--err-bg); border-radius:6px}
  .prev button{background:none; border:0; color:var(--err); text-decoration:underline; cursor:pointer; font:600 14px var(--body)}

  /* awareness */
  .facts{display:grid; gap:10px}
  .fact{background:var(--cream); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:12px 14px}
  .fact h3{font:700 16.5px/1.4 var(--body); color:var(--navy); margin:0 0 3px}
  .fact p{margin:0; font-size:15px; color:#3d3a30}
  .fact.risk{border-left-color:var(--err); background:#fffaf8}
  .partner{text-align:center; background:var(--navy); color:#fff; border-radius:12px; padding:16px 14px; margin-bottom:12px}
  .partner b{display:block; font:700 clamp(19px,4.6vw,23px)/1.35 var(--head); color:#f1dfa6; margin-bottom:4px}
  .partner span{font-size:15px; color:#dfe4ee}
  .agree{display:flex; gap:12px; align-items:flex-start; border:1.5px solid #d9c98f; background:var(--paper); border-radius:10px; padding:12px 14px; cursor:pointer; margin-top:10px; font-size:15.5px}
  .field > .agree{display:flex; margin-bottom:0; font-weight:500}
  .agree input{width:22px; height:22px; margin-top:2px; flex:none; accent-color:var(--gold-dk)}
  .agree:has(input:checked){background:#fbf1d3; border-color:var(--gold)}

  .tdsnote{margin-top:14px; background:#fff8e6; border:1px solid #ecd9a6; border-left:4px solid var(--gold); border-radius:9px; padding:12px 14px; font-size:14.5px; color:#4d3d12}
  .tdsnote > b{display:block; color:var(--navy); font-size:15.5px; margin-bottom:3px}
  .tdsnote span b{color:var(--err)}
  .tdsnote a{color:var(--gold-dk); font-weight:700}
  .note{margin:-4px 0 16px; background:#eef3fb; border-left:4px solid var(--navy); border-radius:8px; padding:10px 12px; font-size:14.5px; color:#22314f}
  .lt-ver{margin:12px 0 0; font-size:12.5px; color:var(--muted); text-align:right}
  .pid{display:inline-block; margin-top:4px; font-weight:700; color:var(--navy)}

  /* consent letter */
  .letter{background:var(--paper); border:1px solid var(--line); border-top:4px solid var(--gold); border-radius:10px; padding:16px 14px; margin-top:4px}
  .lt-top{display:flex; justify-content:space-between; gap:12px; font-size:14px; color:var(--muted); line-height:1.5}
  .lt-top span:last-child{text-align:right; white-space:nowrap}
  .lt-sub{font:700 16px/1.45 var(--body); color:var(--navy); margin:12px 0 6px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .lt-open{font-size:15.5px; margin:8px 0 10px}
  .lt-h{font:700 15px/1.4 var(--body) !important; color:var(--gold-dk)}
  .allbtn{background:none; border:0; color:var(--gold-dk); text-decoration:underline; cursor:pointer; font:600 14.5px var(--body); padding:0; margin:0 0 6px}
  .consent{border:1px solid var(--line); border-radius:9px; background:#fff; padding:0 12px}
  .ck{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #eee3c4; font-size:15px; cursor:pointer}
  .ck:last-child{border-bottom:0}
  .ck input{width:20px; height:20px; margin-top:3px; flex:none; accent-color:var(--gold-dk)}
  .ck b{color:var(--navy)}
  .field.bad .consent{border-color:var(--err)}
  .sig{font-family:"Playfair Display",Georgia,serif !important; font-style:italic; font-size:19px !important}

  .btn{display:block; width:100%; border:0; cursor:pointer; border-radius:12px; font:700 18px/1.2 var(--body); padding:17px 22px; margin-top:18px; background:var(--gold); color:#fff}
  .btn:hover{background:var(--gold-dk)}
  .btn:disabled{opacity:.65; cursor:wait}
  .formmsg{display:none; margin-top:14px; padding:12px 14px; border-radius:9px; background:var(--err-bg); color:#4a1c18; font-size:15px}
  .formmsg.show{display:block}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

  .done{display:none; background:#fff; border:2px solid var(--gold); border-radius:16px; padding:26px 20px; text-align:center; margin-top:16px}
  .done .tick{width:64px; height:64px; border-radius:50%; background:var(--green-bg); color:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 10px}
  .done h2{color:var(--navy); font-size:clamp(23px,5.4vw,28px)}
  .ref{display:inline-block; margin:12px 0 6px; background:var(--cream); border:1px dashed var(--gold); border-radius:8px; padding:7px 16px; font:700 19px Inter,sans-serif; color:var(--gold-dk); letter-spacing:.04em}
  .done p{color:#3d3a30; margin:10px 0 0}
  .app{margin-top:18px; background:var(--navy); color:#fff; border-radius:14px; padding:18px 16px; display:flex; gap:14px; align-items:center; text-align:left}
  .app .ph{flex:none; width:46px; height:74px; border:3px solid #f1dfa6; border-radius:10px; display:flex; align-items:center; justify-content:center; font:700 12px Inter,sans-serif; color:#f1dfa6}
  .app b{display:block; font:700 18px/1.35 var(--head); color:#f1dfa6}
  .app span{font-size:15px; color:#dfe4ee}

  footer{padding:24px 0 36px; text-align:center; font-size:14px; color:var(--muted)}
  footer a{color:var(--gold-dk); font-weight:600}
  /* v2 additions */
  .selfie{display:flex; gap:10px; flex-wrap:wrap}
  .selfie .sbtn{flex:1 1 150px; display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px dashed #cdb873; background:var(--paper); border-radius:10px; padding:13px 12px; cursor:pointer; font:600 15.5px var(--body); color:var(--navy)}
  .selfie .sbtn:hover{background:#fdf7e6}
  .selfie input{position:absolute; width:1px; height:1px; opacity:0}
  .sprev{display:flex; align-items:center; gap:14px; border:1.5px solid var(--green); background:var(--green-bg); border-radius:10px; padding:10px 12px}
  .sprev img{width:96px; height:96px; object-fit:cover; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .sprev .acts{display:flex; flex-direction:column; gap:6px}
  .sprev b{color:var(--green); font-size:15px}
  .sprev button{background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font:600 14px var(--body); color:var(--navy); text-align:left}
  .lt-meta{font-size:14.5px; color:#3d3a30; line-height:1.7}
  .lt-meta b{color:var(--navy)}
  .ck .ct{display:block}
  .ck .ct b{display:block; color:var(--navy); font-size:15px; margin-bottom:1px}
  .ck a, .agree a, footer a.pn{color:var(--gold-dk); font-weight:700}
  .prive{margin-top:16px; border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; background:#fff; padding:12px 12px 2px}
  .prive h3{font:700 15.5px/1.4 var(--body); color:var(--gold-dk); margin:0 0 8px; text-transform:uppercase; letter-spacing:.03em}
  .decl2{display:block; margin-top:6px; color:#4a4536; font-size:14.5px}
  .optin{margin-top:14px}
  .optin .agree{font-size:14.5px; background:#fff}
  .helpbox{margin-top:16px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px}
  .helpbox p{margin:0 0 8px; color:var(--muted); font-size:15px}
  .helpbtn{border:1.5px solid var(--navy); background:#fff; color:var(--navy); border-radius:10px; padding:12px 16px; cursor:pointer; font:700 15.5px var(--body); width:100%}
  .helpbtn:hover{background:var(--navy); color:#fff}
  .helpbtn:disabled{opacity:.6; cursor:wait}
  .helpmsg{display:none; margin-top:10px; font-size:14.5px; border-radius:8px; padding:9px 12px}
  .helpmsg.ok{display:block; background:var(--green-bg); color:#35520f}
  .helpmsg.no{display:block; background:var(--err-bg); color:#4a1c18}
  .otpnote{display:block; margin-top:6px; font-size:13.5px; color:var(--err)}
</style>
</head>
<body>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-label="Choose language" hidden>
  <div class="gatebox">
    <img src="logo.png" alt="Richwealth">
    <p>ભાષા પસંદ કરો · भाषा चुनें<br>Choose your language</p>
    <button type="button" data-lang="gu">ગુજરાતી</button>
    <button type="button" data-lang="hi">हिन्दी</button>
    <button type="button" data-lang="en">English</button>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="langbar" aria-label="Language">
      <button type="button" data-lang="gu">ગુજરાતી</button>
      <button type="button" data-lang="hi">हिन्दी</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <img class="logo" src="logo.png" alt="Richwealth — Trusted since 2011" width="640" height="302">
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <ol class="steps3"><li data-t="p1"></li><li data-t="p2"></li><li data-t="p3"></li></ol>
  </div>
</header>

<main class="wrap">
  <form id="kyc" novalidate autocomplete="on">
    <div class="hp" aria-hidden="true"><label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

    <!-- 1 · your details -->
    <section class="card">
      <h2><span class="num">1</span><span data-t="s1"></span></h2>
      <div class="field" data-k="name"><label for="f-name"><span data-t="name"></span> <span class="req">*</span></label>
        <input id="f-name" type="text" maxlength="80" autocomplete="name"><span class="err" data-t="e_req"></span></div>
      <div class="field" data-k="mobile"><label for="f-mob"><span data-t="mobile"></span> <span class="req">*</span></label>
        <div class="phone"><select id="f-cc" aria-label="Country code"></select><input id="f-mob" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel-national"></div>
        <span class="err" data-t="e_mob"></span></div>
      <div class="field" data-k="email"><label for="f-email" data-t="email"></label>
        <span class="hint" data-t="email_h"></span>
        <input id="f-email" type="email" maxlength="80" autocomplete="email" inputmode="email"><span class="err" data-t="e_email"></span></div>
      <p class="lbl" style="font-weight:600; margin:0 0 8px" data-t="docs_h"></p>
      <div id="docs"></div>
      <div class="field" data-k="selfie"><span class="lbl"><span data-t="ph_l"></span> <span class="req">*</span></span>
        <span class="hint" data-t="ph_h"></span>
        <div id="selfie"></div>
        <input id="in-cam" type="file" accept="image/*" capture="user" hidden>
        <input id="in-up" type="file" accept="image/*" hidden>
        <span class="err" data-t="e_photo"></span></div>
      <fieldset class="field" data-k="panlink" style="margin-bottom:0"><legend><span data-t="pl_q"></span> <span class="req">*</span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="panlink" value="Linked"><span data-t="pl_yes"></span></label>
          <label class="chip"><input type="radio" name="panlink" value="Not linked"><span data-t="pl_no"></span></label>
          <label class="chip"><input type="radio" name="panlink" value="Not sure"><span data-t="pl_ns"></span></label>
          <label class="chip"><input type="radio" name="panlink" value="Exempt / NA"><span data-t="pl_ex"></span></label>
        </div><span class="err" data-t="e_choose"></span></fieldset>
      <div class="tdsnote" role="note"><span data-t="tds_p"></span></div>
    </section>

    <!-- 2 · address, bank & nominee -->
    <section class="card">
      <h2><span class="num">2</span><span data-t="s2"></span></h2>
      <fieldset class="field" data-k="addr_same"><legend><span data-t="addr_q"></span> <span class="req">*</span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="addr_same" value="Same as Aadhaar"><span data-t="addr_yes"></span></label>
          <label class="chip"><input type="radio" name="addr_same" value="Different"><span data-t="addr_no"></span></label>
        </div><span class="err" data-t="e_choose"></span></fieldset>
      <div id="addrbox" class="hide">
        <p class="lbl" style="font-weight:600; margin:0 0 8px" data-t="addr_h"></p>
        <div class="field" data-k="new_address"><label for="f-addr"><span data-t="new_addr"></span> <span class="req">*</span></label>
          <textarea id="f-addr" maxlength="300" autocomplete="street-address"></textarea><span class="err" data-t="e_req"></span></div>
        <div class="row2">
          <div class="field" data-k="city"><label for="f-city"><span data-t="city"></span> <span class="req">*</span></label>
            <input id="f-city" type="text" maxlength="60" autocomplete="address-level2"><span class="err" data-t="e_req"></span></div>
          <div class="field" data-k="state"><label for="f-state"><span data-t="state"></span> <span class="req">*</span></label>
            <input id="f-state" type="text" maxlength="40" autocomplete="address-level1"><span class="err" data-t="e_req"></span></div>
        </div>
        <div class="field" data-k="pin"><label for="f-pin"><span data-t="pin"></span> <span class="req">*</span></label>
          <input id="f-pin" type="text" maxlength="10" inputmode="numeric" autocomplete="postal-code" style="max-width:220px"><span class="err" data-t="e_req"></span></div>
      </div>
      <fieldset class="field" data-k="bank_same"><legend><span data-t="bank_q"></span> <span class="req">*</span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="bank_same" value="Same account"><span data-t="bank_yes"></span></label>
          <label class="chip"><input type="radio" name="bank_same" value="Changed"><span data-t="bank_no"></span></label>
        </div><span class="err" data-t="e_choose"></span></fieldset>
      <p class="note hide" id="bank-note" data-t="bank_note"></p>
      <fieldset class="field" data-k="nom_same"><legend><span data-t="nom_q"></span> <span class="req">*</span></legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="nom_same" value="Same nominee"><span data-t="nom_yes"></span></label>
          <label class="chip"><input type="radio" name="nom_same" value="Update"><span data-t="nom_no"></span></label>
          <label class="chip"><input type="radio" name="nom_same" value="None / not sure"><span data-t="nom_none"></span></label>
        </div><span class="err" data-t="e_choose"></span></fieldset>
      <p class="note hide" id="nom-note" data-t="nom_note"></p>
    </section>

    <!-- 3 · your consent -->
    <section class="card">
      <h2><span class="num">3</span><span data-t="s3"></span></h2>
      <p class="intro" data-t="s3_i"></p>

      <div class="letter">
        <div class="lt-meta">
          <div><span data-t="lt_to"></span> <b>Richwealth</b></div>
          <div><span data-t="lt_cn"></span>: <b id="lt-name">—</b></div>

 c3:"<b>મારું બેંક ખાતું</b>મારા પેમેન્ટ ફક્ત મારા ચકાસાયેલા બેંક ખાતામાં જ કરવામાં આવે. બેંકની માહિતી બદલાય તો હું Richwealthને જાણ કરીશ.",
 c4:"<b>TDS</b>જ્યાં જરૂરી હશે ત્યાં Richwealth લાગુ દરે ટેક્સ કાપીને મારા PAN હેઠળ જમા કરશે. હું સમજું છું કે PAN નિષ્ક્રિય હોય તો વધુ ટેક્સ કપાઈ શકે છે.",
 c5:"<b>Richwealthને પેમેન્ટ</b>હું પૈસા ફક્ત Richwealthના સત્તાવાર બેંક ખાતામાં જ મોકલીશ. હું કોઈ કર્મચારી, એજન્ટ અથવા અન્ય વ્યક્તિના વ્યક્તિગત ખાતામાં પેમેન્ટ નહીં કરું.",

function buildDocs(){

  DOCS.forEach(function(d){
    var f = document.createElement("div"); f.className = "field"; f.setAttribute("data-k", "doc_"+d.k);
    f.innerHTML = '<span class="lbl">'+t(d.t)+' <span class="req">*</span></span>' +
      '<label class="drop"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></span>' +
      '<span class="tx"><b>'+t("tap")+'</b>JPG · PNG · PDF</span><input type="file" accept="image/*,application/pdf"></label>' +
      '<div class="prev"></div><span class="err">'+t("e_doc")+'</span>';
    var inp = f.querySelector("input");
    inp.addEventListener("change", function(){ if (inp.files[0]) addFile(d, inp.files[0], f); inp.value = ""; });
    box.appendChild(f);
    drawPrev(d, f);
  });
}
function addFile(d, file, field){
  var errEl = field.querySelector(".err");
  var isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name), isImg = /^image\//.test(file.type) || /\.(heic|heif)$/i.test(file.name);
  function bad(k){ errEl.textContent = t(k); field.classList.add("bad"); }
  if (!isPdf && !isImg) return bad("e_type");
  if (isPdf && file.size > MAX_RAW) return bad("e_big");
  (isPdf ? readRaw(file) : shrink(file)).then(function(r){
    if (!r) return bad("e_big");
    files[d.k] = r; field.classList.remove("bad"); errEl.textContent = t("e_doc"); drawPrev(d, field);
  });
}
function readRaw(file){
  return new Promise(function(res){
    var fr = new FileReader();
    fr.onload = function(){ res({name:file.name, mime:file.type||"application/pdf", data:String(fr.result).split(",")[1], preview:null}); };
    fr.onerror = function(){ res(null); };
    fr.readAsDataURL(file);
  });
}
function shrink(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, MAX_EDGE / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w*s); c.height = Math.round(h*s);
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var d = c.toDataURL("image/jpeg", JPEG_Q);
      res({name:file.name.replace(/\.[^.]+$/, "")+".jpg", mime:"image/jpeg", data:d.split(",")[1], preview:d});
    };
    img.onerror = function(){ URL.revokeObjectURL(url); if (file.size > MAX_RAW) return res(null); readRaw(file).then(res); };   // e.g. HEIC
    img.src = url;
  });
}
function drawPrev(d, field){
  var box = field.querySelector(".prev"), r = files[d.k], drop = field.querySelector(".drop");
  drop.classList.toggle("has", !!r);
  drop.querySelector(".tx b").textContent = r ? "✓ " + t("added") : t("tap");
  box.innerHTML = "";
  if (!r) return;
  box.innerHTML = (r.preview ? '<img src="'+r.preview+'" alt="">' : '<div class="pdf">PDF</div>') + '<button type="button">'+t("change")+'</button>';
  box.querySelector("button").addEventListener("click", function(){ field.querySelector("input").click(); });
}

    inp.value = "";
    if (!file) return;
    if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)){ errEl.textContent = t("e_img"); field.classList.add("bad"); return; }
    shrink(file).then(function(r){
      if (!r || !r.preview){ errEl.textContent = t(r ? "e_img" : "e_big"); field.classList.add("bad"); return; }
      r.name = "photo.jpg"; files.selfie = r; field.classList.remove("bad"); errEl.textContent = t("e_photo"); buildSelfie();
    });
  });
});

/* ---------- consent letter ---------- */
function buildConsents(){
  var box = $("consents"), was = {};
  box.querySelectorAll("input:checked").forEach(function(i){ was[i.value] = 1; });
  box.innerHTML = "";
  CONSENTS.forEach(function(c, i){
    var l = document.createElement("label"); l.className = "ck";
    l.innerHTML = '<input type="checkbox" name="consent" value="'+c+'"'+(was[c]?" checked":"")+'><span class="ct">'+t(c).replace("<b>", "<b>"+(i+1)+". ")+'</span>';
    box.appendChild(l);
  });
  box.querySelectorAll("a").forEach(function(a){ a.addEventListener("click", function(e){ e.stopPropagation(); }); });
}
function letter(){
  $("lt-name").textContent = val("f-name").toUpperCase() || "—";
  $("lt-cid").textContent = PID || "—";
  $("lt-date").textContent = TODAY;
  $("lt-ver").textContent = t("ver").replace("{v}", CONSENT_VERSION);
}
$("tickall").addEventListener("click", function(){ form.querySelectorAll('input[name="consent"]').forEach(function(i){ i.checked = true; }); mark("consent", false); });
$("f-name").addEventListener("input", letter);
$("f-name").addEventListener("blur", function(){ if (!val("f-sign")) $("f-sign").value = val("f-name").toUpperCase(); });
$("f-city").addEventListener("blur", function(){ if (!val("f-place")) $("f-place").value = val("f-city"); });

/* ---------- language ---------- */
function setLang(l){
  LANG = T[l] ? l : "en";
  document.documentElement.lang = LANG;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(function(el){ el.innerHTML = t(el.getAttribute("data-t")); });
  document.querySelectorAll(".langbar button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG); });
  buildDocs(); buildSelfie(); buildConsents(); letter();
  try { localStorage.setItem("rkyc_lang", LANG); } catch(e){}
}
document.querySelectorAll("[data-lang]").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); $("gate").hidden = true; });
});
var cc = $("f-cc");
CC.forEach(function(c){ var op = document.createElement("option"); op.value = c[0]; op.textContent = c[1]; cc.appendChild(op); });
if (OTP_ON) $("otpbox").classList.remove("hide");

/* ---------- conditional parts ---------- */
function radio(n){ var r = form.querySelector('input[name="'+n+'"]:checked'); return r ? r.value : ""; }
function toggles(){
  $("addrbox").classList.toggle("hide", radio("addr_same") !== "Different");
  $("bank-note").classList.toggle("hide", radio("bank_same") !== "Changed");
  $("nom-note").classList.toggle("hide", !radio("nom_same") || radio("nom_same") === "Same nominee");
  var pv = radio("prive") === "Yes";
  $("pv-ackbox").classList.toggle("hide", !pv);
  if (!pv) $("f-pvack").checked = false;
}
form.addEventListener("change", function(e){ toggles(); var f = e.target.closest(".field"); if (f) f.classList.remove("bad"); });
form.addEventListener("input", function(e){ var f = e.target.closest(".field"); if (f) f.classList.remove("bad"); });
$("f-mob").addEventListener("input", function(){ this.value = digits(this.value); });

/* ---------- submit ---------- */
function mark(k, isBad){ var f = form.querySelector('[data-k="'+k+'"]'); if (!f || f.offsetParent === null) return true; f.classList.toggle("bad", !!isBad); return !isBad; }
function fail(text){ msg.innerHTML = text + " " + t("foot_help"); msg.classList.add("show"); btn.disabled = false; btn.innerHTML = t("submit"); }
function badMobile(){ var mob = digits(val("f-mob")); return cc.value === "+91" ? !/^[6-9]\d{9}$/.test(mob) : !/^\d{6,13}$/.test(mob); }
function stamp(){ var d = new Date(), o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-"; o = Math.abs(o);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)+" "+d.toTimeString().slice(0,8)+" UTC"+s+("0"+Math.floor(o/60)).slice(-2)+":"+("0"+o%60).slice(-2); }
function post(p){
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 120000);
  // text/plain body = no CORS preflight; Apps Script answers with readable JSON.
  return fetch(ENDPOINT, { method:"POST", body: JSON.stringify(p), signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ clearTimeout(timer); return r.json(); }, function(e){ clearTimeout(timer); throw e; });
}

form.addEventListener("submit", function(ev){
  ev.preventDefault(); msg.classList.remove("show");
  var diff = radio("addr_same") === "Different", pv = radio("prive");
  var ok = [
    mark("name", val("f-name").length < 3),
    mark("mobile", badMobile())
  ].concat([
    mark("email", val("f-email") !== "" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val("f-email")))
  ]).concat(DOCS.map(function(d){ return mark("doc_"+d.k, !files[d.k]); })).concat([
    mark("selfie", !files.selfie),
    mark("panlink", !radio("panlink")),
    mark("addr_same", !radio("addr_same")),
    mark("new_address", diff && val("f-addr").length < 8),
    mark("city", diff && val("f-city").length < 2),
    mark("state", diff && val("f-state").length < 2),
    mark("pin", diff && val("f-pin").length < 4),
    mark("bank_same", !radio("bank_same")),
    mark("nom_same", !radio("nom_same")),
    mark("consent", form.querySelectorAll('input[name="consent"]:checked').length !== CONSENTS.length),
    mark("prive", !pv),
    mark("prive_ack", pv === "Yes" && !$("f-pvack").checked),
    mark("decl", !$("f-decl").checked),
    mark("sign", val("f-sign").length < 3),
    mark("place", val("f-place").length < 2),
    mark("otp", OTP_ON && !/^\d{4,6}$/.test(val("f-otp")))
  ]).every(Boolean);
  if (!ok){ var b = form.querySelector(".field.bad"); if (b) b.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (!ENDPOINT){ fail(t("not_open")); return; }

  btn.disabled = true; btn.innerHTML = t("saving");
  var ackTxt = pv === "Yes" ? [plain(t("pv_h")) + ": " + plain(t("pv_ack"))] : [];
  var ackEn = pv === "Yes" ? ["Privé members only: " + plain(T.en.pv_ack)] : [];
  var p = {
    v: 2, name: val("f-name"), mobile: cc.value + " " + digits(val("f-mob")), email: val("f-email"), client_id: PID, panlink: radio("panlink"),
    addr_same: radio("addr_same"), new_address: diff ? val("f-addr") : "", city: diff ? val("f-city") : "", state: diff ? val("f-state") : "", pin: diff ? val("f-pin") : "",
    bank_same: radio("bank_same"), nom_same: radio("nom_same"), prive: pv, prive_ack: pv === "Yes" ? "Yes" : "",
    consents: form.querySelectorAll('input[name="consent"]:checked').length + "/" + CONSENTS.length, decl: "Yes",
    sign: val("f-sign").toUpperCase(), place: val("f-place"), date: TODAY, device_time: stamp(),
    promo: $("f-promo").checked ? "Yes" : "No", otp: OTP_ON ? val("f-otp") : "", version: CONSENT_VERSION,
    lang: LANG,
    consent_en: CONSENTS.map(function(c){ return plain(T.en[c]); }).concat(ackEn, ["Declaration. " + plain(T.en.decl) + " " + plain(T.en.decl2)]),
    consent_text: [plain(t("lt_sub")), plain(t("lt_open"))].concat(CONSENTS.map(function(c, i){ return (i+1) + ". " + plain(t(c)); }), ackTxt,
      [plain(t("decl_h")) + ": " + plain(t("decl")) + " " + plain(t("decl2"))], $("f-promo").checked ? [plain(t("promo"))] : []),
    ua: navigator.userAgent.slice(0, 160), website: form.website.value,
    docs: DOCS.concat([{k:"selfie"}]).map(function(d){ var f = files[d.k]; return {kind:d.k, name:f.name, mime:f.mime, data:f.data}; })
  };
  post(p).then(function(res){
      if (!res || res.ok !== true) throw new Error("not saved");
      $("d-h").textContent = t("d_h").replace("{n}", ", " + p.name.split(/\s+/)[0]);
      $("d-ref").textContent = res.ref || "—";
      form.style.display = "none";
      var d = $("done"); d.style.display = "block"; d.focus(); d.scrollIntoView({behavior:"smooth"});
    })
    .catch(function(){ fail(t("save_fail")); });
});

/* ---------- ask my RM to call me (no consent needed) ---------- */
$("helpbtn").addEventListener("click", function(){
  var hm = $("helpmsg"), hb = this;
  hm.className = "helpmsg";
  var okName = mark("name", val("f-name").length < 3), okMob = mark("mobile", badMobile());
  if (!okName || !okMob){ hm.className = "helpmsg no"; hm.innerHTML = t("help_need"); form.querySelector(".field.bad").scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (!ENDPOINT){ hm.className = "helpmsg no"; hm.innerHTML = t("help_fail"); return; }
  hb.disabled = true; hb.innerHTML = t("help_sending");
  post({ action:"help", name: val("f-name"), mobile: cc.value + " " + digits(val("f-mob")), client_id: PID, lang: LANG,
         device_time: stamp(), website: form.website.value })
    .then(function(res){ if (!res || res.ok !== true) throw new Error("x"); hm.className = "helpmsg ok"; hm.innerHTML = t("help_ok"); hb.innerHTML = "✓ " + t("help_btn"); })
    .catch(function(){ hm.className = "helpmsg no"; hm.innerHTML = t("help_fail"); hb.disabled = false; hb.innerHTML = t("help_btn"); });
});

/* ---------- start ---------- */
var q = (location.search.match(/[?&]lang=(en|hi|gu)/) || [])[1], saved = null;
try { saved = localStorage.getItem("rkyc_lang"); } catch(e){}
setLang(q || saved || "en");
if (!q && !saved){ $("gate").hidden = false; $("gate").querySelector("button").focus(); }
})();
</script>
</body>
</html>
